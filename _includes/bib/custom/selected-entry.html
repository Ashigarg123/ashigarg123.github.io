<div class="pub-entry" style="display: flex; align-items: flex-start; margin-bottom: 2em;">
  {% if entry.fields.image %}
    <div style="margin-right: 1rem;">
      <img src="{{ entry.fields.image | relative_url }}" alt="publication image" style="width: 100px; height: auto; border-radius: 6px;" />
    </div>
  {% endif %}
  <div class="pub-details">
    {{ reference }}
  </div>
</div>
